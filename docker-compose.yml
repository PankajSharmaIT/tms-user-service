version: '3.8'

services:
  userservice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traffic-monitoring-userservice
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://etms.chubebdi6f7l.ap-south-1.rds.amazonaws.com:5432/etmsdb
      SPRING_DATASOURCE_USERNAME: etms_user
      SPRING_DATASOURCE_PASSWORD: CHnMwmBYnZ6EGZSZEayO
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"
      SPRING_JPA_PROPERTIES_HIBERNATE_SHOW_SQL: "true"
      SPRING_JPA_PROPERTIES_HIBERNATE_USE_SQL_COMMENTS: "true"
    ports:
      - "8080:8080"
    networks:
      - tms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/users/greet"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  tms-network:
    driver: bridge


