version: '3.8'

services:
  userservice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traffic-monitoring-userservice
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://etms.chubebdi6f7l.ap-south-1.rds.amazonaws.com:5432/etmsdb
      SPRING_DATASOURCE_USERNAME: etms_user
      SPRING_DATASOURCE_PASSWORD: CHnMwmBYnZ6EGZSZEayO
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "20"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "5"
      SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT: "300000"
      SPRING_DATASOURCE_HIKARI_MAX_LIFETIME: "1200000"
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "30000"
      SPRING_DATASOURCE_HIKARI_AUTO_COMMIT: "true"
      SPRING_DATASOURCE_HIKARI_CONNECTION_TEST_QUERY: "SELECT 1"
      SPRING_DATASOURCE_HIKARI_POOL_NAME: "HikariPool-UserService"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_OPEN_IN_VIEW: "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"
      SPRING_JPA_PROPERTIES_HIBERNATE_SHOW_SQL: "true"
      SPRING_JPA_PROPERTIES_HIBERNATE_USE_SQL_COMMENTS: "true"
      SPRING_JPA_PROPERTIES_HIBERNATE_JDBC_BATCH_SIZE: "20"
      SPRING_JPA_PROPERTIES_HIBERNATE_JDBC_FETCH_SIZE: "50"
      SPRING_JPA_PROPERTIES_HIBERNATE_ORDER_INSERTS: "true"
      SPRING_JPA_PROPERTIES_HIBERNATE_ORDER_UPDATES: "true"
    ports:
      - "8080:8080"
    networks:
      - tms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/users/greet"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  tms-network:
    driver: bridge


